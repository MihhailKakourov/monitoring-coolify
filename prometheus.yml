global:
  scrape_interval: 1m
  evaluation_interval: 1m

scrape_configs:
  # 1. Backend
  - job_name: 'secc-backend'
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s  
    static_configs:
      - targets: ['secc-backend:3000']

  # 2. Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
